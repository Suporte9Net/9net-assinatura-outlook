<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Assinatura 9Net</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="assets/msal-browser.min.js"></script>
  <script src="config.js"></script>
  <script src="signature.js"></script>
  <script defer src="taskpane.js"></script>
</head>
<body>
  <main>
    <h1>Assinatura 9Net</h1>
    <p class="muted">Consulte seus dados do Microsoft 365 e confira exatamente o que sera inserido.</p>

    <div class="actions">
      <button id="connectButton" type="button">Entrar e testar</button>
      <button id="applyButton" class="secondary" type="button" disabled>Aplicar nesta mensagem</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Aguardando teste.</div>

    <section id="profile" class="profile hidden" aria-label="Dados encontrados">
      <div><strong>Nome</strong><span id="profileName"></span></div>
      <div><strong>Cargo</strong><span id="profileTitle"></span></div>
      <div><strong>E-mail</strong><span id="profileEmail"></span></div>
      <div><strong>Telefone</strong><span id="profilePhone"></span></div>
      <div><strong>Ramal (fax)</strong><span id="profileFax"></span></div>
      <div><strong>Celular</strong><span id="profileMobile"></span></div>
      <div><strong>Endereco</strong><span id="profileAddress"></span></div>
    </section>

    <section id="previewSection" class="hidden" aria-label="Pre-visualizacao">
      <h2>Pre-visualizacao</h2>
      <div id="preview" class="preview-wrap"></div>
    </section>
  </main>
</body>
</html>
